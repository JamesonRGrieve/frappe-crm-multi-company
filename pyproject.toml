# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "crm_multi_company"
authors = [
    { name = "Zephyrex Technologies Limited", email = "jameson@zephyrex.ca" }
]
description = "Several businesses in one Frappe CRM: each lead and deal belongs to a business, and quotations go out under the company that business bills under on the day"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "AGPL-3.0-or-later"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[project.urls]
Repository = "https://github.com/JamesonRGrieve/frappe-crm-multi-company"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# Pure-logic unit tests (no bench). Frappe-backed tests run on tests/e2e's podman bench (tests/e2e/run.sh).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E101", "W191", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
